name: Storybook → GitHub Pages

on:
  push:
    branches:
      - 'feature/GUIC-169-refonte-design-v2'
  workflow_dispatch:

# GitHub Pages déploie depuis GitHub Actions (Settings → Pages → Source: GitHub Actions)
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, mais ne pas annuler les builds en cours pour ne pas perdre des sorties.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook-static --quiet

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
