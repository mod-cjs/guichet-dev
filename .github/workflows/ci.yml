name: CI

on:
  push:
    branches: [dev, develop, main]
  pull_request:
    branches: [dev, develop, main]

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      # GUIC-563 — La CI DOIT tourner sur la version de la PRODUCTION (MariaDB 10.11 LTS,
      # instance Plesk), jamais sur une version plus récente. Règle : on aligne la CI sur la
      # prod, jamais l'inverse — sinon on valide du code contre un moteur qui n'est pas celui
      # des 22 000 utilisateurs.
      # Cas réel (GUIC-562) : MariaDB a changé la collation par défaut d'utf8mb4 entre 10.11
      # (general_ci) et 11 (unicode_ci). Une migration sans COLLATE explicite passait en CI
      # sur MariaDB 11 et échouait en production sur 10.11 (clé étrangère refusée, errno 150).
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: guichet_test
          MARIADB_USER: guichet
          MARIADB_PASSWORD: guichet_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd "mariadb-admin ping -h localhost -u guichet -pguichet_test" --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      # GUIC-617 — MinIO manquait ICI et dans le docker-compose local : le test d'intégration
      # stockage-objet (GUIC-565) ne pouvait donc passer NULLE PART (ECONNREFUSED 127.0.0.1:9100).
      # Il avait raison d'exiger un VRAI MinIO — on parle le S3 que MinIO attend, pas celui d'un
      # mock. C'est l'environnement qui était incomplet, pas le test.
      #
      # ⚠️ Balise `edge-cicd` OBLIGATOIRE. `minio/minio` standard exige la commande `server /data`,
      # or les `services:` GitHub ne permettent PAS de passer une commande : le conteneur sort
      # aussitôt (Exited (0)) et tous les tests échouent en ECONNREFUSED. `edge-cicd` embarque
      # cette commande par défaut — c'est la variante prévue pour l'intégration continue.
      # (`bitnami/minio`, l'autre contournement répandu, n'existe plus sur Docker Hub.)
      # Vérifié en local : conteneur vivant en ~6 s, API S3 qui répond, 7/7 tests verts.
      #
      # Port 9100 côté hôte (et non 9000) : laisse le port par défaut libre pour un MinIO déjà
      # monté sur la machine, et correspond au défaut du test (`S3_TEST_ENDPOINT`).
      minio:
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports: ['9100:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      - name: Générer le client Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      # Sentinelle prod (GUIC-563) : la base du service est VIERGE et créée avec la collation
      # par défaut du serveur — exactement comme le sera la base Plesk. Toute migration qui ne
      # s'applique pas à froid sur MariaDB 10.11 fait échouer la CI, au lieu d'exploser en
      # plein go-live avec une base à moitié migrée.
      - name: Migrations à froid (base vierge, MariaDB 10.11 — sentinelle production)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      # GUIC-674 — La base du service est vierge : la table `programmes` est donc VIDE, alors
      # que GUIC-684 a rendu le rattachement à un programme OBLIGATOIRE. Sans ce pas, toute
      # création de ressource ou d'opportunité lève `PROGRAMME_INCONNU` — 30 échecs sur le run
      # 31393048426, tous de cette seule cause.
      #
      # C'est de la donnée de RÉFÉRENCE (les quatre programmes sectoriels du CJS), pas des
      # fixtures : `prisma/seed/reference.ts` ne sème QUE ça. Le seed de développement complet
      # (`prisma/seed/index.ts`) ajouterait opportunités, centres et notifications, et
      # fausserait les suites qui comptent des lignes.
      #
      # Si ça passait en local, c'est que nos bases de dev avaient été semées à la main il y a
      # des mois : la suite était verte par chance. Une base vierge est la seule qui dise la vérité.
      - name: Données de référence (programmes — requis depuis GUIC-684)
        run: npx tsx prisma/seed/reference.ts
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test_secret_ci
          NEXTAUTH_URL: http://localhost:3000
          SSO_BASE_URL: http://localhost:9999
          SSO_CLIENT_ID: guichet-test
          SSO_CLIENT_SECRET: test

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test
          NEXTAUTH_SECRET: test_secret_ci
          NEXTAUTH_URL: http://localhost:3000
          SSO_BASE_URL: http://localhost:9999
          SSO_CLIENT_ID: guichet-test
          SSO_CLIENT_SECRET: test
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: test
          DATAHUB_API_KEY: test
