name: CI

on:
  push:
    branches: [dev, develop, main]
  pull_request:
    branches: [dev, develop, main]

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      # GUIC-563 — La CI DOIT tourner sur la version de la PRODUCTION (MariaDB 10.11 LTS,
      # instance Plesk), jamais sur une version plus récente. Règle : on aligne la CI sur la
      # prod, jamais l'inverse — sinon on valide du code contre un moteur qui n'est pas celui
      # des 22 000 utilisateurs.
      # Cas réel (GUIC-562) : MariaDB a changé la collation par défaut d'utf8mb4 entre 10.11
      # (general_ci) et 11 (unicode_ci). Une migration sans COLLATE explicite passait en CI
      # sur MariaDB 11 et échouait en production sur 10.11 (clé étrangère refusée, errno 150).
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: guichet_test
          MARIADB_USER: guichet
          MARIADB_PASSWORD: guichet_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd "mariadb-admin ping -h localhost -u guichet -pguichet_test" --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      - name: Générer le client Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      # Sentinelle prod (GUIC-563) : la base du service est VIERGE et créée avec la collation
      # par défaut du serveur — exactement comme le sera la base Plesk. Toute migration qui ne
      # s'applique pas à froid sur MariaDB 10.11 fait échouer la CI, au lieu d'exploser en
      # plein go-live avec une base à moitié migrée.
      - name: Migrations à froid (base vierge, MariaDB 10.11 — sentinelle production)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test_secret_ci
          NEXTAUTH_URL: http://localhost:3000
          SSO_BASE_URL: http://localhost:9999
          SSO_CLIENT_ID: guichet-test
          SSO_CLIENT_SECRET: test

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test
          NEXTAUTH_SECRET: test_secret_ci
          NEXTAUTH_URL: http://localhost:3000
          SSO_BASE_URL: http://localhost:9999
          SSO_CLIENT_ID: guichet-test
          SSO_CLIENT_SECRET: test
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: test
          DATAHUB_API_KEY: test
