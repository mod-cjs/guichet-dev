# GUIC-568 — Déploiement continu du Guichet sur OVH.
#
# Principe directeur : ON CONSTRUIT L'IMAGE UNE SEULE FOIS, ET C'EST EXACTEMENT CELLE-LÀ QUI
# VA EN PRODUCTION. Le CD précédent construisait une image jetée aussitôt, puis le serveur
# faisait `git pull origin main` + rebuild → c'est le HEAD de main qui partait, pas le tag.
#
# Ici : build → push vers GHCR → le serveur déploie l'image PAR SON EMPREINTE (digest). Le
# binaire déployé est bit-à-bit celui qui a passé la CI. Le serveur ne reconstruit rien.
name: Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false # ne jamais interrompre un déploiement en cours

jobs:
  build-push:
    name: Construire et pousser l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pousser vers GHCR
    outputs:
      image: ${{ steps.digest.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # C-CD1 — GHCR exige un nom d'image en MINUSCULES. `github.repository` contient des
      # majuscules (…-CJS/guichet) : sans cette normalisation, le push échoue
      # (« repository name must be lowercase ») et AUCUN déploiement ne part.
      - name: Nom d'image GHCR en minuscules
        id: img
        run: |
          # `tr` plutôt que ${VAR,,} : portable quelle que soit la version de bash.
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "base=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Construire et pousser
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.base }}:${{ github.ref_name }}
            ${{ steps.img.outputs.base }}:latest

      - name: Référence par empreinte (digest)
        id: digest
        run: |
          # On déploie par digest, jamais par tag mutable : garantit que le serveur reçoit
          # EXACTEMENT l'image construite ici, même si le tag est repoussé plus tard.
          echo "ref=${{ steps.img.outputs.base }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Déployer sur OVH
    needs: build-push
    runs-on: ubuntu-latest
    environment: production # permet une approbation manuelle si configurée côté repo
    steps:
      - name: Déploiement distant (sauvegarde → migrations → bascule → smoke test → rollback si échec)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          # Le script de déploiement est VERSIONNÉ dans le dépôt cloné côté serveur : on tire
          # sa dernière version, puis on l'exécute avec l'image à déployer (par digest).
          script: |
            set -Eeuo pipefail
            cd /opt/guichet-jeunesse
            # F4 (GUIC-568) : --tags obligatoire — `git fetch origin` seul ne récupère pas de
            # façon fiable un tag léger `v*`, et le checkout du tag échouerait.
            git fetch --tags --force --quiet origin
            git checkout --quiet "${{ github.ref_name }}"
            export GUICHET_IMAGE="${{ needs.build-push.outputs.image }}"
            export COMPOSE_PROJECT_NAME="guichet" # namespace prod, distinct du staging
            echo "${{ github.ref_name }}" > /var/lib/guichet/deploy-stamp
            bash scripts/deploy/deploy.sh
