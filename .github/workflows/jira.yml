name: Jira Integration

on:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted]

# ─────────────────────────────────────────────────────────────
# Flux Git + Statuts Jira
#
#   feature/GUIC-XX  ──PR──►  develop  ──PR──►  main
#
#   PR feature → develop (workflow développeurs) :
#     Ouverte en draft          → En cours
#     Ouverte / ready_for_review → En review
#     Repassée en draft         → En cours
#     Review changes_requested  → En cours
#     Review approved           → En review  (code validé, pas encore mergé)
#     Mergée sur develop        → À valider  (en attente validation PO)
#     Fermée sans merge         → Dans affaires
#
#   PR develop → main (validation PO) :
#     Mergée sur main           → Fini
#
# Note : les jobs Jira sont continue-on-error — ils n'échouent pas si les
# secrets JIRA_* ne sont pas configurés dans le dépôt GitHub.
# ─────────────────────────────────────────────────────────────

jobs:

  # ── 1. Extraire la clé Jira depuis la branche ─────────────
  extract-jira-key:
    name: Extraire la clé Jira
    runs-on: ubuntu-latest
    outputs:
      jira_key: ${{ steps.extract.outputs.jira_key }}
      found:    ${{ steps.extract.outputs.found }}
    steps:
      - name: Extraire GUIC-XX
        id: extract
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ (GUIC-[0-9]+) ]]; then
            echo "jira_key=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "found=true"                  >> $GITHUB_OUTPUT
            echo "Clé trouvée : ${BASH_REMATCH[1]}"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Aucune clé Jira dans : $BRANCH"
          fi

  # ── 2. Valider le titre de la PR ──────────────────────────
  validate-pr-title:
    name: Valider le titre de la PR
    runs-on: ubuntu-latest
    # Uniquement pour les PRs feature → develop (pas develop → main)
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.base_ref == 'develop'
    steps:
      - name: Vérifier GUIC-XX dans le titre
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" =~ GUIC-[0-9]+ ]]; then
            echo "Titre valide : $TITLE"
          else
            echo "ERREUR — Le titre doit contenir GUIC-XX — ex : GUIC-12 feat: description"
            exit 1
          fi

  # ── 3. Transitions de statut ──────────────────────────────
  transition-ticket:
    name: Mettre à jour le statut Jira
    runs-on: ubuntu-latest
    needs: extract-jira-key
    if: needs.extract-jira-key.outputs.found == 'true'
    continue-on-error: true   # non-bloquant si secrets Jira absents
    steps:
      - name: Vérifier la présence des secrets Jira
        id: check
        run: |
          if [ -z "$TOKEN" ]; then
            echo "⚠ Secrets Jira non configurés — transitions ignorées"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Login Jira
        if: steps.check.outputs.skip == 'false'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL:   ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:  ${{ secrets.JIRA_API_TOKEN }}

      # ── PR ouverte en draft → En cours ────────────────────
      - name: PR draft → En cours
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'opened' &&
          github.event.pull_request.draft == true &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "En cours"

      # ── PR ouverte non-draft → En review ──────────────────
      - name: PR ouverte → En review
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'opened' &&
          github.event.pull_request.draft == false &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "En review"

      # ── PR ready for review → En review ───────────────────
      - name: PR ready for review → En review
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'ready_for_review' &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "En review"

      # ── PR repassée en draft → En cours ───────────────────
      - name: PR en draft → En cours
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'converted_to_draft' &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "En cours"

      # ── Review changes requested → En cours ───────────────
      - name: Changes requested → En cours
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'changes_requested' &&
          github.event.pull_request.base.ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "En cours"

      # ── PR mergée sur develop → À valider ─────────────────
      - name: Mergé sur develop → À valider
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "À valider"

      # ── PR mergée sur main → Fini ──────────────────────────
      - name: Mergé sur main → Fini
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.base_ref == 'main'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "Fini"

      # ── PR fermée sans merge → Dans affaires ──────────────
      - name: PR fermée sans merge → Dans affaires
        if: |
          steps.check.outputs.skip == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == false &&
          github.base_ref == 'develop'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "Dans affaires"

  # ── 4. Commenter le ticket à l'ouverture de la PR ─────────
  comment-jira:
    name: Commenter le ticket Jira
    runs-on: ubuntu-latest
    needs: extract-jira-key
    if: |
      needs.extract-jira-key.outputs.found == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.base_ref == 'develop'
    continue-on-error: true   # non-bloquant si secrets Jira absents
    steps:
      - name: Vérifier la présence des secrets Jira
        id: check
        run: |
          if [ -z "$TOKEN" ]; then
            echo "⚠ Secrets Jira non configurés — commentaire ignoré"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Login Jira
        if: steps.check.outputs.skip == 'false'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL:   ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:  ${{ secrets.JIRA_API_TOKEN }}

      - name: Poster le commentaire
        if: steps.check.outputs.skip == 'false'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          comment: |
            🔀 *Pull Request ouverte sur GitHub*

            *Titre :* ${{ github.event.pull_request.title }}
            *Branche :* `${{ github.head_ref }}` → `${{ github.base_ref }}`
            *Auteur :* ${{ github.event.pull_request.user.login }}
            *Statut :* ${{ github.event.pull_request.draft && 'Draft → En cours' || 'Prête → En review' }}
            *Lien :* ${{ github.event.pull_request.html_url }}
