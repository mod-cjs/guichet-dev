# GUIC-589 — Tests E2E Playwright en CI.
#
# Les E2E existaient (tests/e2e/*.spec.ts) mais ne tournaient NULLE PART automatiquement → les
# régressions sur les parcours critiques (auth, routing, réservation) n'étaient pas attrapées.
# Preuve directe de l'intérêt : le challenge a montré que nos pires bugs ne se voient qu'en LIVE
# (C1 : une vraie 500 non loguée). Ce job exécute les parcours en conditions réelles à chaque PR.
name: E2E

on:
  pull_request:
    branches: [dev, develop, main]

jobs:
  e2e:
    name: Playwright (parcours critiques)
    runs-on: ubuntu-latest

    services:
      # MariaDB 10.11 = version de la PRODUCTION (GUIC-563), pas une plus récente.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: guichet_test
          MARIADB_USER: guichet
          MARIADB_PASSWORD: guichet_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h localhost -u guichet -pguichet_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: mysql://guichet:guichet_test@localhost:3306/guichet_test
      REDIS_URL: redis://localhost:6379
      # Secrets de test (signature des cookies de session pour setAuthCookies).
      SESSION_SECRET: e2e_session_secret_ci
      NEXTAUTH_SECRET: e2e_session_secret_ci
      NEXTAUTH_URL: http://localhost:3000
      SSO_BASE_URL: http://localhost:19999
      SSO_CLIENT_ID: guichet-e2e
      SSO_CLIENT_SECRET: test
      PLAYWRIGHT_BASE_URL: http://localhost:3000

      # GUIC-604 — GATES : sans elles, les parcours MÉTIER restaient skippés (le job passait au
      # vert en ne testant que l'auth/routing — un faux-vert de couverture).
      PLAYWRIGHT_SSO_MOCK: '1' # flux OAuth/PKCE complet (le mock est démarré par playwright.config)
      PLAYWRIGHT_E2E_DB: '1' # parcours réservation + check-in (seed Prisma par les fixtures)

      # Secrets PARTAGÉS entre le process Playwright (qui SIGNE cookie staff / jeton QR dans les
      # fixtures) et le serveur Next (qui les VÉRIFIE). S'ils divergent, le check-in échoue.
      STAFF_SESSION_SECRET: e2e-staff-secret-ci
      JWT_CJS_CARD_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CONSEILLER_STAFF_EMAILS: staff.e2e@cjs.sn

      # Sert le BUILD DE PROD plutôt qu'un `next dev` (plus représentatif, et le build valide
      # aussi que l'app compile). Le build se fait à l'étape dédiée ci-dessous.
      PLAYWRIGHT_WEBSERVER_CMD: npm run start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Migrations à froid (base vierge)
        run: npx prisma migrate deploy

      - name: Seed (données de test des parcours)
        run: npx prisma db seed

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de production (servi par `npm run start` aux E2E)
        run: npm run build

      - name: Lancer les E2E (chromium)
        # La config Playwright démarre DEUX serveurs : le SSO mock (19999) puis l'app (3000),
        # pointée sur le mock. Les gates ci-dessus activent les parcours métier.
        run: npx playwright test --project=chromium

      - name: Garde-fou — aucun parcours métier ne doit être SKIPPÉ
        # Leçon C-CD1 : un pipeline « vert » qui ne teste rien est pire que pas de test. Les 6
        # skips des specs sont TOUS pilotés par les gates ci-dessus : si l'un réapparaît (gate
        # perdue, mock non démarré), c'est que la couverture a régressé → on échoue ICI.
        if: always()
        run: node scripts/ci/assert-no-skipped-e2e.mjs playwright-results.json

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
