name: guichet_datahub
version: '2.0.0'
config-version: 2
profile: guichet_datahub

model-paths: ['models']
target-path: 'target'
clean-targets: ['target', 'dbt_packages']

models:
  guichet_datahub:
    # Écrit les descriptions des modèles et de leurs colonnes en COMMENT PostgreSQL.
    # Sans cette option, la documentation ne vit que dans `dbt docs` : un analyste
    # branché en direct sur la base avec son outil BI ne voit rien.
    #
    # ⚠ Ne s'applique QU'AUX MODÈLES. dbt ne commente pas les tables sources — il ne les
    # possède pas. Le dictionnaire de la couche brute (`guichet_raw`) reste consultable
    # via `dbt docs generate`, pas via les métadonnées PostgreSQL.
    +persist_docs:
      relation: true
      columns: true
    marts:
      # Matérialisé en table plutôt qu'en vue : les marts sont lus par des outils BI qui
      # relancent la même agrégation à chaque rafraîchissement d'un tableau de bord.
      # Recalculer en direct sur consultations serait intenable.
      +materialized: table
      +schema: marts
