# GÉNÉRÉ — ne pas éditer à la main. Source : src/lib/datahub/streams.ts + prisma/schema.prisma
# Régénérer : npm run datahub:dbt
version: 2
sources:
  - name: "guichet_raw"
    description: "Données brutes déversées par le tap Guichet. Ne jamais écrire dans ce schéma : il est reconstruit par le pipeline, et toute modification manuelle serait perdue au run suivant."
    schema: "guichet_raw"
    tables:
      - name: "utilisateurs"
        description: "Compte issu du SSO CJS. Aucun mot de passe n'est stocké ici : l'authentification appartient au SSO, ce modèle n'en cache que l'identité et les attributs de profilage."
        loaded_at_field: "updated_at"
        freshness:
          warn_after:
            count: 36
            period: "hour"
          error_after:
            count: 48
            period: "hour"
        columns:
          - name: "cjs_uid"
            description: "Claim `sub` du token SSO — identifiant pivot du jeune dans tout l'écosystème CJS, et seule clé de jointure inter-plateformes."
            meta:
              cjs_tier: "pseudonyme"
            tests:
              - "unique"
              - "not_null"
          - name: "region"
            description: "Région administrative de résidence, parmi les 14 du Sénégal."
            meta:
              cjs_tier: "public"
          - name: "commune"
            description: "Commune de résidence, saisie libre à l'onboarding — non normalisée."
            meta:
              cjs_tier: "public"
          - name: "genre"
            description: "Genre déclaré : `M` ou `F`."
            meta:
              cjs_tier: "public"
          - name: "tranche_age"
            description: "Tranche d'âge à la date d'extraction : -18, 18-24, 25-29, 30-34, 35+, ou inconnu quand la date de naissance est absente ou aberrante. Dérivée d'une donnée identifiante qui, elle, n'est jamais exportée."
            meta:
              cjs_tier: "public"
          - name: "statut"
            description: "État du compte : `actif`, `inactif`, ou `anonymise` après exercice du droit à l'oubli."
            meta:
              cjs_tier: "public"
          - name: "role"
            description: "Rôle principal mis en cache depuis le SSO (source de vérité = SSO ; synchronisé au login)."
            meta:
              cjs_tier: "public"
          - name: "onboarding_complete"
            description: "Le parcours d'onboarding a été mené à son terme. Distingue un compte créé d'un compte réellement activé."
            meta:
              cjs_tier: "public"
          - name: "date_inscription"
            description: "Date de création du compte — sert de date d'inscription dans les indicateurs."
            meta:
              cjs_tier: "public"
          - name: "updated_at"
            description: "Dernière modification du compte. Watermark de réplication Data Hub."
            meta:
              cjs_tier: "public"
          - name: "deleted_at"
            description: "Suppression logique. Non nulle, la ligne reste exportée avec cette date pour que l'entrepôt propage la suppression au lieu de conserver un fantôme."
            meta:
              cjs_tier: "public"
      - name: "profils_jeunes"
        description: "Profil bénéficiaire, rattaché 1:1 à un compte. Porte les données déclaratives d'orientation et d'inclusion, toutes facultatives et auto-déclarées."
        loaded_at_field: "updated_at"
        freshness:
          warn_after:
            count: 36
            period: "hour"
          error_after:
            count: 48
            period: "hour"
        columns:
          - name: "id"
            description: "Identifiant technique du profil, distinct du `cjs_uid` du compte porteur."
            meta:
              cjs_tier: "pseudonyme"
            tests:
              - "unique"
              - "not_null"
          - name: "cjs_uid"
            description: "Compte porteur du profil — clé de jointure vers `utilisateurs`."
            meta:
              cjs_tier: "pseudonyme"
          - name: "niveau_etude"
            description: "Niveau d'études le plus élevé atteint, déclaré par le jeune."
            meta:
              cjs_tier: "public"
          - name: "situation_emploi"
            description: "Situation professionnelle déclarée au moment de la dernière mise à jour du profil."
            meta:
              cjs_tier: "public"
          - name: "situation_handicap"
            description: "Situation de handicap auto-déclarée : `aucun`, `moteur`, `visuel`, `auditif`, `autre`, `non_precise`. Facultative et hors score de complétion (GUIC-660)."
            meta:
              cjs_tier: "public"
          - name: "zone_habitation"
            description: "Zone d'habitation auto-déclarée : `rural` ou `urbain`. Facultative (GUIC-660)."
            meta:
              cjs_tier: "public"
          - name: "completion_score"
            description: "Score 0–100 calculé et mis à jour dans ProfilService.recalculerScore()"
            meta:
              cjs_tier: "public"
          - name: "centre_principal_id"
            description: "Centre de rattachement principal, suggéré à l'onboarding depuis la région SSO puis modifiable."
            meta:
              cjs_tier: "pseudonyme"
          - name: "created_at"
            description: "Date de création du profil."
            meta:
              cjs_tier: "public"
          - name: "updated_at"
            description: "Dernière modification du profil. Watermark de réplication Data Hub."
            meta:
              cjs_tier: "public"
      - name: "opportunites"
        description: "Table mère M3 v2 (CTI). Colonnes legacy (type, organisation) conservées pendant la migration data — supprimées en 178d après backfill. Les colonnes polymorphiques (typeId, programmeId, organisationId déjà présent, organisationLibelle, niveauEtudeMin) sont ajoutées en NULL dans cette étape (178b) pour ne pas casser les rows existantes ; elles passent NOT NULL en 178d. L'invariant XOR (1 et 1 seul sous-type non null) est garanti côté applicatif via OpportuniteService — cf. spec §8.4 et `opportunite-integrity.ts`."
        loaded_at_field: "updated_at"
        freshness:
          warn_after:
            count: 36
            period: "hour"
          error_after:
            count: 48
            period: "hour"
        columns:
          - name: "id"
            description: "Identifiant de l'opportunité."
            meta:
              cjs_tier: "pseudonyme"
            tests:
              - "unique"
              - "not_null"
          - name: "slug"
            description: "Identifiant lisible utilisé dans l'URL publique."
            meta:
              cjs_tier: "public"
          - name: "titre"
            description: "Intitulé de l'offre tel qu'affiché au public."
            meta:
              cjs_tier: "public"
          - name: "type_legacy"
            description: "Type historique de l'offre (enum legacy). Conservé le temps de la migration polymorphique ; `type_id` est la forme cible."
            meta:
              cjs_tier: "public"
          - name: "type_id"
            description: "Type de l'offre dans le référentiel polymorphique. Nullable tant que la migration des données legacy n'est pas achevée."
            meta:
              cjs_tier: "pseudonyme"
          - name: "domaine"
            description: "Secteur d'activité : agriculture, numérique, entrepreneuriat, citoyenneté, environnement, santé, éducation, culture, autre."
            meta:
              cjs_tier: "public"
          - name: "region"
            description: "Région ciblée par l'offre — pas nécessairement celle du candidat."
            meta:
              cjs_tier: "public"
          - name: "organisation_id"
            description: "Organisation émettrice dans le référentiel. Nullable pour les offres importées sans organisation identifiée."
            meta:
              cjs_tier: "pseudonyme"
          - name: "organisation_libelle"
            description: "Nom de l'organisation émettrice tel qu'affiché, y compris quand elle n'est pas au référentiel."
            meta:
              cjs_tier: "public"
          - name: "niveau_etude_min"
            description: "Niveau d'études minimum requis, tel que renseigné par l'émetteur."
            meta:
              cjs_tier: "public"
          - name: "remuneration"
            description: "Rémunération annoncée, en texte libre — non normalisée, non comparable entre offres."
            meta:
              cjs_tier: "public"
          - name: "deadline"
            description: "Date limite de candidature. Au-delà, l'offre passe en `expiree`."
            meta:
              cjs_tier: "public"
          - name: "statut"
            description: "Cycle de vie éditorial : `brouillon`, `publiee`, `archivee`, `expiree`."
            meta:
              cjs_tier: "public"
          - name: "recruteur_uid"
            description: "Recruteur propriétaire de l'offre, quand elle a été déposée depuis l'espace recruteur."
            meta:
              cjs_tier: "pseudonyme"
          - name: "vues"
            description: "Compteur cumulé d'affichages du détail. Incrémenté en direct, sans déduplication par visiteur."
            meta:
              cjs_tier: "public"
          - name: "created_at"
            description: "Date de création de l'offre."
            meta:
              cjs_tier: "public"
          - name: "updated_at"
            description: "Dernière modification de l'offre. Watermark de réplication Data Hub."
            meta:
              cjs_tier: "public"
          - name: "deleted_at"
            description: "Suppression logique. Non nulle, la ligne reste exportée pour que l'entrepôt propage la suppression."
            meta:
              cjs_tier: "public"
      - name: "candidatures"
        description: "Candidature d'un jeune à une opportunité, unique par couple (jeune, opportunité). Porte la traçabilité du consentement CGU exigée par la CDP."
