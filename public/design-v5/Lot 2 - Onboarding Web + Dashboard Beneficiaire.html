<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 2 — Onboarding Web + Dashboard Bénéficiaire · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<script src="image-slot.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="cjs-card.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel" src="web-onboarding.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="tablet-dashboard.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="mobile-centres.jsx"></script>
<script type="text/babel" src="mobile-flows.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 820;
const WEB_DASH_H = 1100;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 2 — Onboarding Web + Dashboard Bénéficiaire"
    subtitle="Web (5 écrans onboarding + 2 états dashboard) · Mobile (3 flows clés)"
  >
    <DCSection
      id="web-onboarding"
      title="A · F1 Onboarding — Version Web"
      subtitle="Landing → Téléphone OTP → Objectif → Profil → Recommandations"
    >
      <DCArtboard id="wo-1" label="01 · Landing" width={WEB_W} height={WEB_H}>
        <WebOnboard1Landing />
      </DCArtboard>
      <DCArtboard id="wo-2" label="02 · Téléphone + OTP" width={WEB_W} height={WEB_H}>
        <WebOnboard2Phone />
      </DCArtboard>
      <DCArtboard id="wo-3" label="03 · Objectif" width={WEB_W} height={WEB_H}>
        <WebOnboard3Goal />
      </DCArtboard>
      <DCArtboard id="wo-4" label="04 · Profil" width={WEB_W} height={WEB_H}>
        <WebOnboard4Profile />
      </DCArtboard>
      <DCArtboard id="wo-5" label="05 · Recommandations Yaye" width={WEB_W} height={WEB_H}>
        <WebOnboard5Preview />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="web-dashboard"
      title="B · Dashboard Bénéficiaire — Version Web"
      subtitle="Espace authentifié : default + flow Yaye ouvert"
    >
      <DCArtboard id="wd-1" label="Dashboard · état par défaut" width={WEB_W} height={WEB_DASH_H}>
        <WebDashboard />
      </DCArtboard>
      <DCArtboard id="wd-2" label="Dashboard · Yaye ouvert (panel)" width={WEB_W} height={WEB_DASH_H}>
        <WebDashboard yayeOpen />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile-dashboard"
      title="C · Dashboard Bénéficiaire — Version Mobile"
      subtitle="Default (Lot 1) + Notifications drawer + Yaye plein écran"
    >
      <DCArtboard id="md-1" label="Dashboard · état par défaut" width={PHONE_W} height={PHONE_H}>
        <Onboard6Dashboard />
      </DCArtboard>
      <DCArtboard id="md-2" label="Drawer notifications" width={PHONE_W} height={PHONE_H}>
        <MobileDashWithNotifs />
      </DCArtboard>
      <DCArtboard id="md-3" label="Centres CJS · carte QR + RDV + ateliers" width={PHONE_W} height={PHONE_H}>
        <MobileCentresScreen />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile-flows"
      title="D · Flows mobile depuis le dashboard"
      subtitle="Découverte opp · Recherche & filtres"
    >
      <DCArtboard id="mf-1" label="Fiche opportunité (depuis dashboard)" width={PHONE_W} height={PHONE_H}>
        <MobileOppDetail />
      </DCArtboard>
      <DCArtboard id="mf-2" label="Recherche · filtres ouverts" width={PHONE_W} height={PHONE_H}>
        <MobileSearchFilter />
      </DCArtboard>
    </DCSection>
    <DCSection
      id="tablet-dashboard"
      title="E · Breakpoint tablette — 834px (iPad portrait)"
      subtitle="Rail d'icônes 76px · contenu 2 colonnes (vs 3 desktop, 1 mobile)"
    >
      <DCArtboard id="td-1" label="Dashboard · tablette 834×1112" width={834} height={1112}>
        <TabletDashboard />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="lot-nav.js"></script>
<script src="toast.js"></script>
<script src="accessibility.js"></script>
<script src="yaye-fab.js"></script>
</body>
</html>
