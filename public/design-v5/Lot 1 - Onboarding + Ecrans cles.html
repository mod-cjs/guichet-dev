<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 1 — Onboarding + Écrans clés · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<script src="image-slot.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  /* Make sure icons inherit currentColor */
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- DesignCanvas + screens -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="cjs-card.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="mobile-centres.jsx"></script>

<script type="text/babel">
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Guichet Jeunesse Sénégal — Lot 1"
    subtitle="F1 Onboarding (6 écrans) + 3 écrans clés · mobile-first"
  >
    <DCSection
      id="f1"
      title="FLOW F1 — Inscription & Onboarding"
      subtitle="Landing → Téléphone OTP → Objectif → Profil → Recommandations → Dashboard"
    >
      <DCArtboard id="f1-01" label="01 · Landing" width={PHONE_W} height={PHONE_H}>
        <Onboard1Welcome />
      </DCArtboard>
      <DCArtboard id="f1-02" label="02 · Téléphone + OTP" width={PHONE_W} height={PHONE_H}>
        <Onboard2Phone />
      </DCArtboard>
      <DCArtboard id="f1-03" label="03 · Choix objectif" width={PHONE_W} height={PHONE_H}>
        <Onboard3Goal />
      </DCArtboard>
      <DCArtboard id="f1-04" label="04 · Profil minimal" width={PHONE_W} height={PHONE_H}>
        <Onboard4Profile />
      </DCArtboard>
      <DCArtboard id="f1-05" label="05 · Recommandations Yaye" width={PHONE_W} height={PHONE_H}>
        <Onboard5Preview />
      </DCArtboard>
      <DCArtboard id="f1-06" label="06 · Dashboard (entrée)" width={PHONE_W} height={PHONE_H}>
        <Onboard6Dashboard />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="key-screens"
      title="3 écrans clés"
      subtitle="Pipeline candidatures · Yaye plein écran · Centre de notifications"
    >
      <DCArtboard id="s-05" label="#5 · Mes candidatures (pipeline)" width={PHONE_W} height={PHONE_H}>
        <CandidaturesPipeline />
      </DCArtboard>
      <DCArtboard id="s-10" label="#10 · Yaye plein écran" width={PHONE_W} height={PHONE_H}>
        <YayeFullScreen />
      </DCArtboard>
      <DCArtboard id="s-13" label="#13 · Centre de notifications" width={PHONE_W} height={PHONE_H}>
        <NotificationsScreen />
      </DCArtboard>
      <DCArtboard id="s-centres" label="Centres CJS · carte QR + RDV + ateliers" width={PHONE_W} height={PHONE_H}>
        <MobileCentresScreen />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="lot-nav.js"></script>
<script src="toast.js"></script>
<script src="accessibility.js"></script>
<script src="yaye-fab.js"></script>
</body>
</html>
