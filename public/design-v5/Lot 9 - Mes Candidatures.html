<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="stylesheet" href="tokens.css">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="candidatures-data.jsx"></script>
<script type="text/babel" src="candidatures-web.jsx"></script>
<script type="text/babel" src="candidatures-mobile.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 1180;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 9 — Mes candidatures"
    subtitle="Suivi des candidatures du bénéficiaire · liste + timeline de progression (web + mobile)"
  >
    <DCSection
      id="web"
      title="A · Web — Suivi des candidatures"
      subtitle="Sidebar bénéficiaire · liste filtrable + détail avec timeline · navigation cliquable"
    >
      <DCArtboard id="w1" label="Liste · stats + pipeline" width={WEB_W} height={WEB_H}>
        <WebCandidatures view="list" />
      </DCArtboard>
      <DCArtboard id="w2" label="Détail · entretien planifié" width={WEB_W} height={WEB_H}>
        <WebCandidatures view="detail" />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile"
      title="B · Mobile — Suivi des candidatures"
      subtitle="Liste + détail avec timeline · navigation cliquable"
    >
      <DCArtboard id="m1" label="Liste · stats + pipeline" width={PHONE_W} height={PHONE_H}>
        <MobCandApp start="list" />
      </DCArtboard>
      <DCArtboard id="m2" label="Détail · timeline de suivi" width={PHONE_W} height={PHONE_H}>
        <MobCandApp start="detail" />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="lot-nav.js"></script>
<script src="toast.js"></script>
<script src="accessibility.js"></script>
<script src="yaye-fab.js"></script>
