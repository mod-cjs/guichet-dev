<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 10 — Espace Recruteur · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="recruteur-data.jsx"></script>
<script type="text/babel" src="recruteur-shell.jsx"></script>
<script type="text/babel" src="settings-shared.jsx"></script>
<script type="text/babel" src="recruteur-web.jsx"></script>
<script type="text/babel" src="recruteur-web2.jsx"></script>
<script type="text/babel" src="recruteur-mobile.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 1180;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 10 — Espace Recruteur"
    subtitle="Entreprises & partenaires · offres, pipeline kanban, fiche candidat, entretien, messagerie (web + mobile)"
  >
    <DCSection
      id="web"
      title="A · Web — Back-office recruteur"
      subtitle="Sidebar accent bleu distincte · navigation cliquable entre les vues"
    >
      <DCArtboard id="w1" label="Tableau de bord recruteur" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="home" />
      </DCArtboard>
      <DCArtboard id="w2" label="Mes offres" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="offers" />
      </DCArtboard>
      <DCArtboard id="w3" label="Publier une offre · formulaire" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="offerForm" />
      </DCArtboard>
      <DCArtboard id="w4" label="Pipeline kanban des candidatures" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="pipeline" />
      </DCArtboard>
      <DCArtboard id="w5" label="Fiche candidat + adéquation" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="candidate" />
      </DCArtboard>
      <DCArtboard id="w6" label="Messagerie candidats" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="messages" />
      </DCArtboard>
      <DCArtboard id="w7" label="Entretiens à venir" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="interviews" />
      </DCArtboard>
      <DCArtboard id="w8" label="Profil entreprise" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="company" />
      </DCArtboard>
      <DCArtboard id="w9" label="Paramètres" width={WEB_W} height={WEB_H}>
        <WebRecruteur view="settings" />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile"
      title="B · Mobile — Recruteur en déplacement"
      subtitle="Bottom-nav recruteur · pipeline par onglet · navigation cliquable"
    >
      <DCArtboard id="m1" label="Tableau de bord" width={PHONE_W} height={PHONE_H}>
        <MobRecruteurApp start="home" />
      </DCArtboard>
      <DCArtboard id="m2" label="Mes offres" width={PHONE_W} height={PHONE_H}>
        <MobRecruteurApp start="offers" />
      </DCArtboard>
      <DCArtboard id="m3" label="Pipeline · candidatures" width={PHONE_W} height={PHONE_H}>
        <MobRecruteurApp start="pipeline" />
      </DCArtboard>
      <DCArtboard id="m4" label="Fiche candidat" width={PHONE_W} height={PHONE_H}>
        <MobRecruteurApp start="candidate" />
      </DCArtboard>
      <DCArtboard id="m5" label="Messagerie" width={PHONE_W} height={PHONE_H}>
        <MobRecruteurApp start="messages" />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="accessibility.js"></script>
</body>
</html>
