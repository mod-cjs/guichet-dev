<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 6 — Ressources numériques · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="resources-data.jsx"></script>
<script type="text/babel" src="resources-web.jsx"></script>
<script type="text/babel" src="resources-mobile.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 1180;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 6 — Ressources numériques"
    subtitle="Médiathèque CJS · accueil · catégorie · fiche · lecteur (web + mobile)"
  >
    <DCSection
      id="web"
      title="A · Web — Médiathèque"
      subtitle="Sidebar 260 · accueil (catégories + mises en avant) · liste par catégorie · fiche détail · lecteur PDF"
    >
      <DCArtboard id="w1" label="Accueil médiathèque" width={WEB_W} height={WEB_H}>
        <WebResources view="home" />
      </DCArtboard>
      <DCArtboard id="w2" label="Liste par catégorie · filtres" width={WEB_W} height={WEB_H}>
        <WebResources view="list" />
      </DCArtboard>
      <DCArtboard id="w3" label="Fiche détail · aperçu + sommaire" width={WEB_W} height={WEB_H}>
        <WebResources view="detail" />
      </DCArtboard>
      <DCArtboard id="w4" label="Lecteur PDF · sommaire + pages" width={WEB_W} height={WEB_H}>
        <WebResources view="reader" />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile"
      title="B · Mobile — Médiathèque"
      subtitle="Accueil · liste par catégorie · fiche détail · lecteur PDF"
    >
      <DCArtboard id="m1" label="Accueil médiathèque" width={PHONE_W} height={PHONE_H}>
        <MobileResApp start="home" />
      </DCArtboard>
      <DCArtboard id="m2" label="Liste par catégorie" width={PHONE_W} height={PHONE_H}>
        <MobileResApp start="list" />
      </DCArtboard>
      <DCArtboard id="m3" label="Fiche détail" width={PHONE_W} height={PHONE_H}>
        <MobileResApp start="detail" />
      </DCArtboard>
      <DCArtboard id="m4" label="Lecteur PDF" width={PHONE_W} height={PHONE_H}>
        <MobileResApp start="reader" />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="accessibility.js"></script>
</body>
</html>
