# GUIC-544 — Promtail : collecte des logs et envoi vers Loki.
#
# Deux sources, et c'est tout l'intérêt du ticket — répondre à « que s'est-il passé entre 14h02
# et 14h07 sur cette route ? » exige de croiser les DEUX :
#   1. l'APPLICATION (conteneur Docker, JSON structuré déjà produit par src/lib/logger.ts) ;
#   2. le REVERSE PROXY nginx/Plesk, qui vit sur l'hôte et voit TOUTES les requêtes — y compris
#      celles qui n'atteignent jamais l'app (502, timeouts, blocages TLS).
#
# ⚠️ CARDINALITÉ — la règle qui protège l'index : un label = un flux. Mettre `requestId` ou un
# `cjs_uid` en label créerait un flux par requête et ferait exploser Loki. Le requestId se cherche
# donc par FILTRE de contenu, pas par label :
#     {job="guichet-app"} | json | requestId = "abc-123"
# C'est aussi ce qui satisfait le critère « rechercher tous les logs d'un requestId donné ».

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  # Persisté (volume) : au redémarrage, Promtail reprend où il s'est arrêté au lieu de tout
  # réexpédier — sinon chaque redémarrage duplique les logs et gonfle le disque.
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── 1. Logs de l'application (conteneur Docker) ─────────────────────────────
  - job_name: guichet-app
    static_configs:
      - targets: [localhost]
        labels:
          job:  guichet-app
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Docker enveloppe chaque ligne : {"log":"<notre JSON>\n","stream":"stdout","time":"…"}
      - json:
          expressions:
            sortie: log
            flux:   stream
            heure:  time
      - timestamp:
          source: heure
          format: RFC3339Nano

      # Notre logger émet du JSON structuré. On extrait de quoi filtrer — sans en faire des
      # labels, sauf `level` (cardinalité bornée : info/warn/error).
      - json:
          source: sortie
          expressions:
            level:     level
            message:   message
            requestId: requestId
            path:      path
            status:    status
      - labels:
          level:
      # Le corps indexé reste la ligne JSON d'origine : `| json` permet ensuite de filtrer sur
      # n'importe quel champ (requestId, path, status) sans coût de cardinalité.
      - output:
          source: sortie

      # ── Garde-fou CDP, en DERNIÈRE ligne de défense ─────────────────────────
      # L'application scrube déjà (hashId, scrubPath, scrubMessage). Ceci rattrape ce qui
      # aurait échappé — un log ajouté à la hâte, une dépendance bavarde. Mieux vaut deux
      # filets qu'un seul : ce qui entre dans Loki y reste 30 jours.
      - replace:
          expression: '([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})'
          replace: '[email]'
      - replace:
          expression: '(\+221[0-9]{9})'
          replace: '[phone]'

  # ── 2. Logs du reverse proxy (nginx / Plesk, sur l'HÔTE) ────────────────────
  # Ce sont eux qui portent le statut et la latence de TOUTES les requêtes, et le
  # `req=<request_id>` posé par nginx (cf. docs/observabilite.md §1) — la clé de corrélation
  # avec les logs applicatifs.
  - job_name: nginx-proxy
    static_configs:
      - targets: [localhost]
        labels:
          job:  nginx-proxy
          __path__: /var/log/nginx/*access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) (?P<methode>\S+) (?P<uri>\S+) (?P<statut>\d{3}) (?P<duree>\S+) req=(?P<requestId>\S+)'
      - labels:
          statut:
      # L'IP est une donnée personnelle au sens CDP : on ne l'indexe pas en label et on la
      # neutralise dans la ligne conservée.
      - replace:
          expression: '^(\S+) '
          replace: '[ip] '

  - job_name: nginx-erreurs
    static_configs:
      - targets: [localhost]
        labels:
          job:  nginx-proxy-erreurs
          __path__: /var/log/nginx/*error.log

  # ── 3. Tâches planifiées et sauvegardes (GUIC-576) ──────────────────────────
  # Ces travaux tournent en CRON SUR L'HÔTE, pas dans un conteneur : leur sortie n'apparaît donc
  # ni dans les logs Docker ni dans ceux de nginx. Sans cette collecte, deux seuils exigés par
  # GUIC-576 — échec répété d'une tâche planifiée, échec de sauvegarde — ne pourraient JAMAIS se
  # déclencher : on aurait des règles d'alerte branchées sur un signal inexistant.
  #
  # Destinations (déjà en place) :
  #   /var/log/guichet/cron.log    <- scripts/cron/generate-crontab.sh
  #   /var/log/guichet/backup.log  <- scripts/backup/README.md (backup.sh + restore-drill.sh)
  #
  # Ce sont les échecs les plus dangereux du système : ils sont SILENCIEUX. Une sauvegarde qui ne
  # tourne plus ne se remarque que le jour où on en a besoin — trop tard. Une purge CV qui ne
  # tourne plus est un manquement à la rétention CDP que rien ne signale.
  - job_name: guichet-taches
    static_configs:
      - targets: [localhost]
        labels:
          job:  guichet-taches
          __path__: /var/log/guichet/*.log
    pipeline_stages:
      # Les scripts shell colorisent leur sortie ; les codes ANSI parasitent la recherche.
      - replace:
          expression: '(\x1b\[[0-9;]*m)'
          replace: ''
      # `[backup:erreur]` et `[deploy:erreur]` (err() dans les scripts) et « ✗ » (preflight)
      # marquent un échec. On en fait un label de SÉVÉRITÉ, à cardinalité bornée (2 valeurs),
      # pour que les règles d'alerte s'y accrochent sans scanner tout le contenu.
      - regex:
          expression: '(?P<marqueur>\[[a-z]+:erreur\]|✗)'
      - labels:
          marqueur:
