# GUIC-576 — Points de contact : OÙ part une alerte.
#
# Provisionné par fichier, pas cliqué dans l'interface : la configuration est versionnée, revue
# en PR, et se rejoue à l'identique après reconstruction du conteneur. Un contact posé à la main
# disparaît au premier `docker compose down -v` — et personne ne s'en aperçoit avant l'incident.
#
# ⚠️ LIMITE STRUCTURELLE, à connaître avant de faire confiance à ce fichier :
# Grafana tourne SUR la machine qu'il supervise. Il ne peut pas alerter sur sa propre mort. Si le
# serveur tombe — panne, noyau, réseau OVH — ces contacts ne partent PAS.
# C'est précisément le rôle de la sonde externe (GUIC-575, UptimeRobot), hors infrastructure.
#
#   Serveur À TERRE          -> sonde externe UptimeRobot   (GUIC-575)
#   Serveur DEBOUT, dégradé  -> Grafana, ce fichier          (GUIC-576)
#
# Les deux sont nécessaires : aucun ne couvre le cas de l'autre.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: astreinte
    receivers:
      # ── E-mail ────────────────────────────────────────────────────────────
      # Relais SMTP posé côté conteneur (GF_SMTP_*, docker-compose.observabilite.yml) — même
      # compte que la SSO (SMTP2GO). Reste ouvert, distinct : SPF/DKIM/DMARC (GUIC-577) pour
      # la délivrabilité — sans ces enregistrements DNS, l'e-mail part mais peut atterrir en
      # spam. Ce fichier configure l'ENVOI, pas la délivrabilité.
      - uid: astreinte-email
        type: email
        settings:
          addresses: ${ALERTE_EMAILS}
          subject: '[{{ .CommonLabels.severite | toUpper }}] Guichet — {{ .CommonLabels.alertname }}'
          # Horodatage + lien direct vers la règle dans Grafana par alerte : de quoi agir
          # sans deviner, sans ouvrir un tableau de bord pour retrouver le contexte.
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}

            Déclenchée : {{ .StartsAt.Format "2006-01-02 15:04 MST" }}
            Voir dans Grafana : {{ .GeneratorURL }}
            {{ end }}

      # ── WhatsApp, via un relais EXTERNE ───────────────────────────────────
      # Meta Cloud API exige un en-tête `Authorization: Bearer` et un corps JSON qui lui est
      # propre — Grafana envoie le sien. D'où un relais qui retraduit.
      #
      # Le relais vit HORS de notre serveur (Cloudflare Worker, offre gratuite), et c'est
      # délibéré : le même relais sert la sonde externe (GUIC-575), qui, elle, doit fonctionner
      # quand le serveur est à terre. Un relais unique et externe couvre les deux cas ; un relais
      # local n'en couvrirait qu'un.
      #
      # GUIC-576 — RETIRÉ AUTOMATIQUEMENT si ALERTE_WEBHOOK_URL est absente
      # (select-contact-points.sh, exécuté avant Grafana). Grafana valide TOUS les points de
      # contact déclarés au démarrage, MÊME ceux qu'aucune politique n'utilise — une URL vide
      # ici ferait planter Grafana ENTIER (« required field 'url' is not specified »), pas
      # seulement désactiver ce canal. Les marqueurs ci-dessous délimitent le bloc retiré.
      # BEGIN-WEBHOOK-RECEIVER
      - uid: astreinte-whatsapp
        type: webhook
        settings:
          url: ${ALERTE_WEBHOOK_URL}
          httpMethod: POST
          # Le secret partagé empêche n'importe qui de déclencher des messages WhatsApp en
          # connaissant l'URL du relais.
          authorization_scheme: Bearer
          authorization_credentials: ${ALERTE_WEBHOOK_TOKEN}
          title: '[{{ .CommonLabels.severite | toUpper }}] Guichet — {{ .CommonLabels.alertname }}'
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
      # END-WEBHOOK-RECEIVER
