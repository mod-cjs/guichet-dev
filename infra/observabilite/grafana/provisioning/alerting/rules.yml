# GUIC-576 — Règles d'alerte : À PARTIR DE QUEL SEUIL on dérange quelqu'un.
#
# Chaque règle porte un label `severite` :
#   alerte         -> on réveille quelqu'un, maintenant ;
#   avertissement  -> on regarde demain.
# Sans cette distinction, tout devient urgent, donc plus rien ne l'est.
#
# ⚠️ NE SONT ÉCRITES ICI QUE LES RÈGLES DONT LE SIGNAL EXISTE. Une alerte branchée sur un signal
# absent ne se déclenche jamais et donne une fausse sécurité — pire que pas d'alerte du tout,
# parce qu'on croit être couvert.
#   - Saturation disque et mémoire -> **Netdata → Prometheus** (GUIC-545) : ce sont des métriques
#     machine, elles n'apparaissent dans aucun log — Loki ne peut pas les voir. Les seuils sont
#     ci-dessous (groupe guichet-machine), contre les noms de métriques vérifiés en réel
#     (`curl http://127.0.0.1:19999/api/v1/allmetrics?format=prometheus`), pas devinés.
#   - Indisponibilité totale -> **sonde externe** (GUIC-575) : Grafana meurt avec le serveur.

apiVersion: 1

groups:
  - orgId: 1
    name: guichet-disponibilite
    folder: Guichet
    interval: 1m
    rules:
      # ── Taux de 5xx — le signal qui décide d'un rollback pendant le canary ──
      - uid: guichet-5xx-alerte
        title: Taux de 5xx élevé
        condition: C
        for: 5m # 5 min de persistance : un pic isolé (redéploiement) ne réveille personne.
        labels:
          severite: alerte
        annotations:
          summary: 'Plus de 5 % des requêtes échouent en 5xx depuis 5 minutes.'
          description: >-
            Vérifier si un déploiement vient d'avoir lieu (rollback : scripts/deploy/rollback.sh)
            puis /api/health. Logs : {job="guichet-app"} | json | level="error"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # LogQL ne connait PAS `clamp_min` (verifie : « syntax error: unexpected
              # IDENTIFIER »). Le ratio nu suffit : sans trafic, Loki ne renvoie rien et
              # `noDataState: OK` traite l'absence de requetes comme une absence d'incident.
              expr: >-
                sum(count_over_time({job="nginx-proxy", statut=~"5.."}[5m]))
                /
                sum(count_over_time({job="nginx-proxy"}[5m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C
        noDataState: OK # Aucun trafic = pas d'incident (nuit, staging au repos).
        execErrState: Error

      - uid: guichet-5xx-avertissement
        title: Taux de 5xx en hausse
        condition: C
        for: 15m # Une tendance, pas une urgence : on veut la voir monter, pas sursauter.
        labels:
          severite: avertissement
        annotations:
          summary: 'Plus de 1 % de 5xx depuis 15 minutes — dégradation lente.'
          description: 'À regarder demain si ça persiste. Souvent : une route qui échoue en silence.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: >-
                sum(count_over_time({job="nginx-proxy", statut=~"5.."}[15m]))
                /
                sum(count_over_time({job="nginx-proxy"}[15m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.01] }
              refId: C
        noDataState: OK
        execErrState: Error

  - orgId: 1
    name: guichet-taches-planifiees
    folder: Guichet
    interval: 5m
    rules:
      # ── Échec de sauvegarde ────────────────────────────────────────────────
      # La perte de données est irrattrapable ; une indisponibilité ne l'est pas. C'est la seule
      # panne dont on ne se remet pas — d'où le réveil immédiat, sans période de tolérance.
      - uid: guichet-sauvegarde-echec
        title: Échec de sauvegarde
        condition: C
        for: 0m
        labels:
          severite: alerte
        annotations:
          summary: 'La sauvegarde a échoué.'
          description: >-
            Vérifier /var/log/guichet/backup.log et relancer scripts/backup/backup.sh.
            Tant qu'elle échoue, AUCUN déploiement ne doit partir : deploy.sh refuse de migrer
            sans point de restauration, et c'est voulu.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="guichet-taches"} |= "backup:erreur" [1h]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error

      # ── Sauvegarde ABSENTE — la panne silencieuse ─────────────────────────
      # Le cas le plus dangereux du système : la sauvegarde ne PLANTE pas, elle ne tourne PLUS
      # (cron retiré, disque plein, machine redémarrée sans crontab). Rien n'échoue, donc rien
      # n'alerte — et on le découvre le jour où on a besoin de restaurer.
      # 26 h de fenêtre pour une tâche quotidienne : tolère un décalage sans laisser passer un jour.
      - uid: guichet-sauvegarde-absente
        title: Aucune sauvegarde depuis 26 heures
        condition: C
        for: 0m
        labels:
          severite: alerte
        annotations:
          summary: 'Aucune trace de sauvegarde depuis 26 h — la tâche ne tourne peut-être plus.'
          description: >-
            Vérifier que la crontab existe encore (crontab -l | grep GUICHET-BACKUP) et que
            /var/log/guichet/backup.log est bien alimenté. Une sauvegarde qui ne tourne plus ne
            se remarque QUE le jour où on en a besoin.
        data:
          - refId: A
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="guichet-taches"} |= "backup" [26h]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        # NoData vaut ici ALERTE : aucune ligne de log = c'est précisément le symptôme.
        noDataState: Alerting
        execErrState: Error

      # ── Tâches planifiées en échec ────────────────────────────────────────
      # Un échec isolé arrive (réseau, verrou). Trois en une heure, c'est une panne. Parmi ces
      # tâches : la purge des CV, qui porte la rétention CDP — son arrêt est un manquement
      # réglementaire que rien d'autre ne signalerait.
      #
      # GUIC-576/700 — s'appuie sur le label `marqueur="✗"` (posé par promtail.yml sur
      # CHAQUE ligne d'échec de /var/log/guichet/*.log), pas sur une regex qui redétecte le
      # contenu. Trouvé en configurant réellement les alertes : l'ancienne regex
      # `(?i)(erreur|error|failed|échec)` ne matchait ni « ÉCHOUÉE », ni « ÉCHOUÉ », ni
      # « ÉCART » — le vocabulaire RÉEL de scripts/etl/lib-log.sh (run-nightly.sh,
      # purge-absents-weekly.sh) — laissant le pipeline ETL échouer en silence.
      - uid: guichet-cron-echecs-repetes
        title: Échecs répétés d'une tâche planifiée
        condition: C
        for: 0m
        labels:
          severite: avertissement
        annotations:
          summary: 'Au moins 3 échecs de tâches planifiées en 1 heure.'
          description: >-
            Voir /var/log/guichet/cron.log. Attention à la purge des CV : son arrêt est un
            manquement à la rétention CDP.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="guichet-taches", marqueur="✗"} [1h]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C
        noDataState: OK
        execErrState: Error

      # ── Échec du pipeline ETL Data Hub (GUIC-700) ─────────────────────────
      # Réveil immédiat, pas de tolérance à 3 occurrences : contrairement à une tâche
      # applicative isolée, un run ETL en échec signifie que l'entrepôt reçoit des données
      # périmées ou incomplètes SANS QUE RIEN NE LE SIGNALE côté consommateurs BI — même
      # philosophie que « sauvegarde échec » ci-dessus (irrattrapable si on laisse traîner).
      # Filtré sur « [datahub] », le marqueur littéral que lib-log.sh écrit sur CHAQUE ligne
      # (run-nightly.sh : extraction, dbt build, réconciliation ; purge-absents-weekly.sh),
      # pour ne jamais se déclencher sur un échec de cron applicatif sans rapport.
      - uid: guichet-etl-echec
        title: Échec du pipeline ETL Data Hub
        condition: C
        for: 0m
        labels:
          severite: alerte
        annotations:
          summary: 'Le pipeline ETL Data Hub (nightly ou purge hebdomadaire) a échoué.'
          description: >-
            Voir /var/log/guichet/datahub-nightly.log et datahub-purge-absents.log.
            L'entrepôt peut désormais servir des données périmées ou incomplètes aux
            consommateurs BI — ne pas attendre le prochain run programmé.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="guichet-taches", marqueur="✗"} |= "[datahub]" [1h]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error

  - orgId: 1
    name: guichet-machine
    folder: Guichet
    interval: 1m
    rules:
      # ── Saturation disque (GUIC-545) ──────────────────────────────────────
      # « Un disque plein arrête les trois plateformes » (SSO + BRM + Guichet, serveur
      # mutualisé, docker-compose.prod.yml). Filtré sur mount_point="/" précisément : Netdata
      # expose aussi des pseudo-systèmes de fichiers noyau (efivarfs, bpf, tracefs, pstore,
      # configfs — tous à 0 GiB), les inclure pollue le calcul du taux réel.
      - uid: guichet-disque-alerte
        title: Disque presque plein
        condition: C
        for: 5m
        labels:
          severite: alerte
        annotations:
          summary: 'Plus de 90 % du disque racine est utilisé.'
          description: >-
            Voir Netdata (tableau de bord, disque). Purger les sauvegardes/dumps obsolètes
            (scripts/backup/README.md rétention) avant tout — un disque plein bloque
            migrations, sauvegardes ET logs en même temps.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: >-
                netdata_disk_space_GiB_average{mount_point="/",dimension="used"}
                /
                (netdata_disk_space_GiB_average{mount_point="/",dimension="used"}
                 + netdata_disk_space_GiB_average{mount_point="/",dimension="avail"})
                * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        # Absence de données = Prometheus/Netdata ne répondent plus — en soi un incident de
        # supervision (vécu en réel ce jour : les deux ont tourné en boucle de redémarrage
        # plusieurs dizaines de minutes sans que rien ne le signale).
        noDataState: Alerting
        execErrState: Error

      - uid: guichet-disque-avertissement
        title: Disque en hausse
        condition: C
        for: 15m
        labels:
          severite: avertissement
        annotations:
          summary: 'Plus de 80 % du disque racine est utilisé — tendance à surveiller.'
          description: 'À regarder demain si ça persiste, avant que ça devienne critique.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: >-
                netdata_disk_space_GiB_average{mount_point="/",dimension="used"}
                /
                (netdata_disk_space_GiB_average{mount_point="/",dimension="used"}
                 + netdata_disk_space_GiB_average{mount_point="/",dimension="avail"})
                * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        noDataState: Alerting
        execErrState: Error

      # ── Mémoire disponible (GUIC-545) ──────────────────────────────────────
      # `available`, pas `used`/`free` bruts : le cache et les buffers comptent comme
      # « utilisés » dans ces derniers alors qu'ils sont récupérables à la demande — piège
      # observé en réel avec l'alerte swap de Netdata (99,9 % swap plein, mais 15 Gio
      # disponibles, aucun incident réel). `available` est ce que le noyau donnerait
      # effectivement à une nouvelle application, mêmes seuils absolus (Gio) que `free -h`.
      - uid: guichet-memoire-alerte
        title: Mémoire disponible critique
        condition: C
        for: 5m
        labels:
          severite: alerte
        annotations:
          summary: 'Moins de 3 Gio de mémoire disponible sur le serveur mutualisé.'
          description: >-
            Voir Netdata (tableau de bord, mémoire par conteneur) pour identifier quel
            service consomme — SSO, BRM et Guichet partagent cette machine.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'netdata_mem_available_MiB_average{chart="mem.available",dimension="avail"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [3072] } # 3 Gio
              refId: C
        noDataState: Alerting
        execErrState: Error

      - uid: guichet-memoire-avertissement
        title: Mémoire disponible en baisse
        condition: C
        for: 15m
        labels:
          severite: avertissement
        annotations:
          summary: 'Moins de 6 Gio de mémoire disponible — tendance à surveiller.'
          description: 'À regarder demain si ça persiste, avant que ça devienne critique.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'netdata_mem_available_MiB_average{chart="mem.available",dimension="avail"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [6144] } # 6 Gio
              refId: C
        noDataState: Alerting
        execErrState: Error
