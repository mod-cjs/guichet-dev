# GUIC-545 — Config minimale : n'écouter QUE sur la boucle locale.
#
# `network_mode: host` (docker-compose.netdata.yml) est nécessaire pour que Netdata voie les
# VRAIES interfaces et le VRAI disque de l'hôte (pas la vue isolée d'un conteneur) — mais ce mode
# désactive l'isolation de ports de Docker : sans cette directive, le tableau de bord (19999)
# serait exposé sur TOUTES les interfaces, y compris publiques. Même principe que Grafana
# (docker-compose.observabilite.yml) : accès par tunnel SSH uniquement, jamais 0.0.0.0.

[global]
    # Serveur mutualisé (SSO + BRM + Guichet) : Netdata lui-même ne doit pas devenir la charge
    # qu'il surveille.
    memory mode = ram
    history = 3600

[web]
    bind to = 127.0.0.1:19999
