services:

  # ── Application Next.js ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guichet_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Surcharge l'URL localhost par le nom du service Docker.
      # Base de test Yaye Lot 1 : dataset POC enrichi (aligné avec le graphe Neo4j).
      DATABASE_URL: mysql://guichet:guichet_dev_password@mariadb:3306/yaye_poc_enriched
      REDIS_URL: redis://redis:6379
      # Knowledge Graph Neo4j (Lot 1) — service Docker `neo4j`, base `enriched`.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: yaye_dev_password
      NEO4J_DATABASE: enriched
      # Connexion de test SANS SSO (dev/login) — local uniquement, jamais en prod.
      # GUIC-564 : l'image est bâtie en NODE_ENV=production ; la connexion sans SSO exige donc
      # désormais DEUX variables délibérées. Et même ainsi, l'application REFUSE DE DÉMARRER si
      # l'URL publique n'est pas locale — ce qui neutralise le scénario « ce compose déployé sur
      # le serveur ». La production utilise docker-compose.prod.yml, qui n'a ni l'une ni l'autre.
      APP_ENV: "local"
      ALLOW_DEV_LOGIN: "true"
      # LMStudio tourne sur l'HÔTE (Mac) : depuis le conteneur, localhost = le conteneur.
      # On pointe donc le serveur local via host.docker.internal (cf. extra_hosts).
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # En développement : commenter le build et décommenter ce bloc
    # pour utiliser le hot-reload au lieu de l'image compilée
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.next
    # command: npm run dev

  # ── MariaDB 10.11 LTS — MÊME VERSION QUE LA PRODUCTION ────
  # GUIC-563 : la prod tourne sur l'instance MariaDB 10.11 de Plesk. Le dev et la CI
  # s'alignent dessus, jamais l'inverse — sinon on valide du code contre un moteur qui
  # n'est pas celui des 22 000 utilisateurs (cf. GUIC-562 : la collation par défaut
  # d'utf8mb4 diffère entre 10.11 et 11, ce qui cassait une migration en prod seulement).
  #
  # ⚠️ MIGRATION DEPUIS UN VOLUME MariaDB 11 : MariaDB ne sait pas rétrograder un
  # répertoire de données. Un volume créé par la 11.x fera échouer le démarrage de la 10.11.
  # Recréer le volume local (données de dev, reconstructibles) :
  #     docker compose down -v && docker compose up -d mariadb
  #     npx prisma migrate deploy && npm run seed
  mariadb:
    image: mariadb:10.11
    container_name: guichet_mariadb
    restart: unless-stopped
    # Le contournement serveur précédent (--character-set-collations=utf8mb4=utf8mb4_unicode_ci,
    # option MariaDB 11.4+ INEXISTANTE en 10.11) n'a plus lieu d'être : depuis GUIC-562, CHAQUE
    # migration déclare sa collation explicitement, donc plus aucune table ne dépend du défaut
    # du serveur. La sentinelle `tests/unit/migrations-collation.test.ts` empêche la régression.
    # NO_ZERO_DATE / NO_ZERO_IN_DATE ajoutés au sql_mode par défaut : sans eux, MariaDB
    # accepte `0000-00-00`, que le driver Prisma ne sait PAS relire — toute lecture
    # complète d'une ligne concernée lève « Invalid time value ». Constaté sur la base
    # POC : 7 999 lignes de profils_jeunes et 3 000 d'inscriptions_evenements en
    # portaient, rendant deux flux d'export inexploitables et cassant tout findMany sur
    # ces tables. Interdire l'écriture est la seule prévention ; réparer après coup ne
    # fait que repousser.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE
    environment:
      MARIADB_DATABASE: guichet_jeunesse
      MARIADB_USER: guichet
      MARIADB_PASSWORD: guichet_dev_password
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # 3307 en local — 3306 réservé à cjs_mysql (SSO)
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "guichet", "-pguichet_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: guichet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # exposé pour inspection locale
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j 5 — Knowledge Graph Yaye (Lot 1) ────────────────
  # Vue dérivée de MariaDB (read-model). En local d'abord ; bascule vers
  # Neo4j Aura en prod via les env vars NEO4J_* (cf. yaye-kg-poc/.env).
  # Édition ENTERPRISE (licence d'évaluation, usage dev local) pour le
  # multi-database : bases `standard` (dump brut) et `enriched` (enrichi).
  neo4j:
    image: neo4j:5-enterprise
    container_name: guichet_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/yaye_dev_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MinIO — stockage objet S3 (CV, photos, justificatifs) ──
  # GUIC-617 — MinIO manquait ici ET dans la CI : le test d'intégration stockage-objet
  # (GUIC-565) échouait en ECONNREFUSED 127.0.0.1:9100 chez tout le monde, ce qui rendait
  # `npm run validate` rouge en permanence et le `--no-verify` routinier. Le test avait raison
  # d'exiger un VRAI MinIO (on parle le S3 que MinIO attend, pas celui d'un mock) : c'est
  # l'environnement local qui était incomplet.
  #
  # Port 9100 côté hôte (9000 dans le conteneur) : correspond au défaut de `S3_TEST_ENDPOINT`
  # et laisse 9000 libre pour un MinIO déjà installé sur la machine.
  # Identifiants alignés sur le test (`minioadmin` / `minioadmin123`) — usage DEV LOCAL
  # uniquement : en production, les secrets vivent dans /etc/guichet/prod.env (chmod 600).
  minio:
    image: minio/minio:latest
    container_name: guichet_minio
    restart: unless-stopped
    # L'image standard n'a pas de commande par défaut : sans `server /data`, le conteneur sort
    # aussitôt. (En CI, où les `services:` n'acceptent pas de commande, on utilise la balise
    # `edge-cicd` qui l'embarque — cf. .github/workflows/ci.yml.)
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"   # API S3
      - "9101:9001"   # console web (http://localhost:9101)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
