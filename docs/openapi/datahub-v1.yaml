paths:
  "/export/utilisateurs":
    get:
      summary: "Exporter le flux utilisateurs"
      description: "Compte issu du SSO CJS. Aucun mot de passe n'est stocké ici : l'authentification appartient au SSO, ce modèle n'en cache que l'identité et les attributs de profilage."
      operationId: "export_utilisateurs"
      parameters:
        - "$ref": "#/components/parameters/since"
        - "$ref": "#/components/parameters/cursor"
        - "$ref": "#/components/parameters/limit"
      responses:
        "200":
          description: "Page de utilisateurs"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/utilisateursRow"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          description: "Curseur ou borne `since` malformés"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erreur"
        "401":
          description: "Clé API absente, invalide, ou non configurée côté serveur"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erreur"
        "429":
          description: "Quota dépassé (300 requêtes/minute par clé)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erreur"
