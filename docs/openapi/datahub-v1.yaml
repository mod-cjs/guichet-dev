          "x-cjs-tier": "public"
        conseillers_count:
          type: "integer"
          description: "Nombre de conseillers affectés, saisi et non calculé."
          "x-cjs-tier": "public"
        gc_id:
          type:
            - "integer"
            - "null"
          description: "Identifiant du centre dans la plateforme Gestion Centres — clé de rapprochement inter-plateformes."
          "x-cjs-tier": "pseudonyme"
        created_at:
          type: "string"
          format: "date-time"
          description: "Date de création de la fiche."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
    reservationsRow:
      type: "object"
      description: "Réservation d'une ressource par un jeune. MVP : auto-validée (statut=Acceptee) à la création. Sprint+1 : workflow approval activable (StatutReservation.EnAttente)."
      properties:
        id:
          type: "string"
          description: "Identifiant de la réservation."
          "x-cjs-tier": "pseudonyme"
        cjs_uid:
          type: "string"
          description: "Jeune réservant — clé de jointure vers `utilisateurs`."
          "x-cjs-tier": "pseudonyme"
        centre_id:
          type: "string"
          description: "Centre où la ressource est réservée."
