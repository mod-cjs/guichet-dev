          type: "string"
          description: "Identifiant du centre."
          "x-cjs-tier": "pseudonyme"
        nom_centre:
          type: "string"
          description: "Nom du centre — désigne l'établissement, jamais une personne."
          "x-cjs-tier": "public"
        slug:
          type:
            - "string"
            - "null"
          description: "Identifiant lisible utilisé dans l'URL publique."
          "x-cjs-tier": "public"
        region:
          type: "string"
          enum:
            - "Dakar"
            - "Thies"
            - "Diourbel"
            - "Fatick"
            - "Kaolack"
            - "Kaffrine"
            - "Louga"
            - "Saint_Louis"
            - "Matam"
            - "Tambacounda"
            - "Kedougou"
            - "Kolda"
            - "Ziguinchor"
            - "Sedhiou"
          description: "Région d'implantation."
          "x-cjs-tier": "public"
        ville:
          type:
            - "string"
            - "null"
          description: "Ville d'implantation."
          "x-cjs-tier": "public"
        adresse:
          type: "string"
          description: "Adresse postale du centre. Donnée d'établissement, publiée sur la fiche."
