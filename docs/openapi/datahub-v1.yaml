# GÉNÉRÉ — ne pas éditer à la main. Source : src/lib/datahub/streams.ts + prisma/schema.prisma
# Régénérer : npm run datahub:openapi
openapi: "3.1.0"
info:
  title: "Guichet Jeunesse — Data Hub API"
  version: "2.0"
  description: "API d'export incrémental du Guichet Jeunesse CJS, consommée par le tap Meltano du Data Hub. Les outils BI lisent l'entrepôt PostgreSQL, pas cette API.\n\nCe fichier est GÉNÉRÉ depuis le contrat d'export (src/lib/datahub/streams.ts) et la documentation du schéma. Ne pas l'éditer à la main : npm run datahub:openapi."
servers:
  - url: "https://guichet.cjs.sn/api/v1"
    description: "Production"
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Clé API Data Hub. Refusée si la variable n'est pas configurée côté serveur (GUIC-631)."
  parameters:
    since:
      name: "since"
      in: "query"
      description: "Borne basse sur la colonne de réplication, ISO 8601. Le consommateur doit appliquer un recouvrement de quelques minutes sur son dernier point d'arrêt : la colonne est posée à l'écriture applicative, pas au commit, et une transaction committée en retard serait sinon jamais extraite."
      schema:
        type: "string"
        format: "date-time"
    sinceRequis:
      name: "since"
      in: "query"
      required: true
      description: "Borne basse, ISO 8601 — OBLIGATOIRE sur cet endpoint (GUIC-697 D6) : un comptage non borné sur les 13 flux, dont `consultations`, dépasse `maxDuration = 60`."
      schema:
        type: "string"
        format: "date-time"
    cursor:
      name: "cursor"
      in: "query"
      description: "Curseur opaque renvoyé par la page précédente. Exclusif avec `since`."
      schema:
        type: "string"
    limit:
      name: "limit"
      in: "query"
      description: "Taille de page."
      schema:
        type: "integer"
        default: 1000
        minimum: 1
        maximum: 5000
  schemas:
    Meta:
      type: "object"
      description: "Pagination par curseur. `next_cursor` est opaque et doit être renvoyé tel quel ; il n'y a pas de total, un COUNT par page coûtant plus cher que la page elle-même."
      properties:
        next_cursor:
          type:
            - "string"
            - "null"
          description: "Curseur de la page suivante, null à la fin."
        has_more:
          type: "boolean"
          description: "Une page suivante existe."
        replication_key:
          type: "string"
          description: "Colonne portant le watermark de ce flux."
        generated_at:
          type: "string"
          format: "date-time"
          description: "Horodatage de la réponse."
    Erreur:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
    utilisateursRow:
      type: "object"
      description: "Compte issu du SSO CJS. Aucun mot de passe n'est stocké ici : l'authentification appartient au SSO, ce modèle n'en cache que l'identité et les attributs de profilage."
      properties:
        cjs_uid:
          type: "string"
          description: "Claim `sub` du token SSO — identifiant pivot du jeune dans tout l'écosystème CJS, et seule clé de jointure inter-plateformes."
          "x-cjs-tier": "pseudonyme"
        region:
          type:
            - "string"
            - "null"
          enum:
            - "Dakar"
            - "Thies"
            - "Diourbel"
            - "Fatick"
            - "Kaolack"
            - "Kaffrine"
            - "Louga"
            - "Saint_Louis"
            - "Matam"
            - "Tambacounda"
            - "Kedougou"
            - "Kolda"
            - "Ziguinchor"
            - "Sedhiou"
          description: "Région administrative de résidence, parmi les 14 du Sénégal."
          "x-cjs-tier": "public"
        commune:
          type:
            - "string"
            - "null"
          description: "Commune de résidence, saisie libre à l'onboarding — non normalisée."
          "x-cjs-tier": "public"
        genre:
          type:
            - "string"
            - "null"
          enum:
            - "M"
            - "F"
          description: "Genre déclaré : `M` ou `F`."
          "x-cjs-tier": "public"
        tranche_age:
          type: "string"
          description: "Tranche d'âge à la date d'extraction : -18, 18-24, 25-29, 30-34, 35+, ou inconnu quand la date de naissance est absente ou aberrante. Dérivée d'une donnée identifiante qui, elle, n'est jamais exportée."
          "x-cjs-tier": "public"
        statut:
          type: "string"
          enum:
            - "actif"
            - "inactif"
            - "anonymise"
          description: "État du compte : `actif`, `inactif`, ou `anonymise` après exercice du droit à l'oubli."
          "x-cjs-tier": "public"
        role:
          type:
            - "string"
            - "null"
          description: "Rôle principal mis en cache depuis le SSO (source de vérité = SSO ; synchronisé au login)."
          "x-cjs-tier": "public"
        onboarding_complete:
          type: "boolean"
          description: "Le parcours d'onboarding a été mené à son terme. Distingue un compte créé d'un compte réellement activé."
          "x-cjs-tier": "public"
        date_inscription:
          type: "string"
          format: "date-time"
          description: "Date de création du compte — sert de date d'inscription dans les indicateurs."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification du compte. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
        deleted_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Suppression logique. Non nulle, la ligne reste exportée avec cette date pour que l'entrepôt propage la suppression au lieu de conserver un fantôme."
          "x-cjs-tier": "public"
    profils_jeunesRow:
      type: "object"
      description: "Profil bénéficiaire, rattaché 1:1 à un compte. Porte les données déclaratives d'orientation et d'inclusion, toutes facultatives et auto-déclarées."
      properties:
        id:
          type: "string"
          description: "Identifiant technique du profil, distinct du `cjs_uid` du compte porteur."
          "x-cjs-tier": "pseudonyme"
        cjs_uid:
          type: "string"
          description: "Compte porteur du profil — clé de jointure vers `utilisateurs`."
          "x-cjs-tier": "pseudonyme"
        niveau_etude:
          type:
            - "string"
            - "null"
          description: "Niveau d'études le plus élevé atteint, déclaré par le jeune."
          "x-cjs-tier": "public"
        situation_emploi:
          type:
            - "string"
            - "null"
          description: "Situation professionnelle déclarée au moment de la dernière mise à jour du profil."
          "x-cjs-tier": "public"
        situation_handicap:
          type:
            - "string"
            - "null"
          enum:
            - "aucun"
            - "moteur"
            - "visuel"
            - "auditif"
            - "autre"
            - "non_precise"
          description: "Situation de handicap auto-déclarée : `aucun`, `moteur`, `visuel`, `auditif`, `autre`, `non_precise`. Facultative et hors score de complétion (GUIC-660)."
          "x-cjs-tier": "public"
        zone_habitation:
          type:
            - "string"
            - "null"
          enum:
            - "rural"
            - "urbain"
          description: "Zone d'habitation auto-déclarée : `rural` ou `urbain`. Facultative (GUIC-660)."
          "x-cjs-tier": "public"
        completion_score:
          type: "integer"
          description: "Score 0–100 calculé et mis à jour dans ProfilService.recalculerScore()"
          "x-cjs-tier": "public"
        centre_principal_id:
          type:
            - "string"
            - "null"
          description: "Centre de rattachement principal, suggéré à l'onboarding depuis la région SSO puis modifiable."
          "x-cjs-tier": "pseudonyme"
        created_at:
          type: "string"
          format: "date-time"
          description: "Date de création du profil."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification du profil. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
    opportunitesRow:
      type: "object"
      description: "Table mère M3 v2 (CTI). Colonnes legacy (type, organisation) conservées pendant la migration data — supprimées en 178d après backfill. Les colonnes polymorphiques (typeId, programmeId, organisationId déjà présent, organisationLibelle, niveauEtudeMin) sont ajoutées en NULL dans cette étape (178b) pour ne pas casser les rows existantes ; elles passent NOT NULL en 178d. L'invariant XOR (1 et 1 seul sous-type non null) est garanti côté applicatif via OpportuniteService — cf. spec §8.4 et `opportunite-integrity.ts`."
      properties:
        id:
          type: "string"
          description: "Identifiant de l'opportunité."
          "x-cjs-tier": "pseudonyme"
        slug:
          type: "string"
          description: "Identifiant lisible utilisé dans l'URL publique."
          "x-cjs-tier": "public"
        titre:
          type: "string"
          description: "Intitulé de l'offre tel qu'affiché au public."
          "x-cjs-tier": "public"
        type_legacy:
          type: "string"
          enum:
            - "Emploi"
            - "Stage"
            - "Formation"
            - "Bourse"
            - "Volontariat"
            - "Appel_a_projets"
          description: "Type historique de l'offre (enum legacy). Conservé le temps de la migration polymorphique ; `type_id` est la forme cible."
          "x-cjs-tier": "public"
        type_id:
          type:
            - "string"
            - "null"
          description: "Type de l'offre dans le référentiel polymorphique. Nullable tant que la migration des données legacy n'est pas achevée."
          "x-cjs-tier": "pseudonyme"
        domaine:
          type: "string"
          enum:
            - "Agriculture"
            - "Numerique"
            - "Entrepreneuriat"
            - "Citoyennete"
            - "Environnement"
            - "Sante"
            - "Education"
            - "Culture"
            - "Autre"
          description: "Secteur d'activité : agriculture, numérique, entrepreneuriat, citoyenneté, environnement, santé, éducation, culture, autre."
          "x-cjs-tier": "public"
        region:
          type:
            - "string"
            - "null"
          enum:
            - "Dakar"
            - "Thies"
            - "Diourbel"
            - "Fatick"
            - "Kaolack"
            - "Kaffrine"
            - "Louga"
            - "Saint_Louis"
            - "Matam"
            - "Tambacounda"
            - "Kedougou"
            - "Kolda"
            - "Ziguinchor"
            - "Sedhiou"
          description: "Région ciblée par l'offre — pas nécessairement celle du candidat."
          "x-cjs-tier": "public"
        organisation_id:
          type:
            - "string"
            - "null"
          description: "Organisation émettrice dans le référentiel. Nullable pour les offres importées sans organisation identifiée."
          "x-cjs-tier": "pseudonyme"
        organisation_libelle:
          type:
            - "string"
            - "null"
          description: "Nom de l'organisation émettrice tel qu'affiché, y compris quand elle n'est pas au référentiel."
          "x-cjs-tier": "public"
        niveau_etude_min:
          type:
            - "string"
            - "null"
          enum:
            - "BFEM"
            - "BAC"
            - "BAC_PLUS_2"
            - "BAC_PLUS_3"
            - "BAC_PLUS_5"
            - "DOCTORAT"
          description: "Niveau d'études minimum requis, tel que renseigné par l'émetteur."
          "x-cjs-tier": "public"
        remuneration:
          type:
            - "string"
            - "null"
          description: "Rémunération annoncée, en texte libre — non normalisée, non comparable entre offres."
          "x-cjs-tier": "public"
        deadline:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Date limite de candidature. Au-delà, l'offre passe en `expiree`."
          "x-cjs-tier": "public"
        statut:
          type: "string"
          enum:
            - "brouillon"
            - "publiee"
            - "archivee"
            - "expiree"
          description: "Cycle de vie éditorial : `brouillon`, `publiee`, `archivee`, `expiree`."
          "x-cjs-tier": "public"
        recruteur_uid:
          type:
            - "string"
            - "null"
          description: "Recruteur propriétaire de l'offre, quand elle a été déposée depuis l'espace recruteur."
          "x-cjs-tier": "pseudonyme"
        vues:
          type: "integer"
          description: "Compteur cumulé d'affichages du détail. Incrémenté en direct, sans déduplication par visiteur."
          "x-cjs-tier": "public"
        created_at:
          type: "string"
          format: "date-time"
          description: "Date de création de l'offre."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification de l'offre. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
        deleted_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Suppression logique. Non nulle, la ligne reste exportée pour que l'entrepôt propage la suppression."
          "x-cjs-tier": "public"
    candidaturesRow:
      type: "object"
      description: "Candidature d'un jeune à une opportunité, unique par couple (jeune, opportunité). Porte la traçabilité du consentement CGU exigée par la CDP."
      properties:
        id:
          type: "string"
          description: "Identifiant de la candidature."
          "x-cjs-tier": "pseudonyme"
        cjs_uid:
          type: "string"
          description: "Jeune candidat — clé de jointure vers `utilisateurs`."
          "x-cjs-tier": "pseudonyme"
        opportunite_id:
          type: "string"
          description: "Offre visée — clé de jointure vers `opportunites`."
          "x-cjs-tier": "pseudonyme"
        statut:
          type: "string"
          enum:
            - "En_attente"
            - "Vue"
            - "Retenue"
            - "Refusee"
          description: "Décision côté offre : `En_attente`, `Vue`, `Retenue`, `Refusee`."
          "x-cjs-tier": "public"
        pipeline_stage:
          type: "string"
          enum:
            - "Recue"
            - "Preselection"
            - "Entretien"
            - "Decision"
          description: "Étape du pipeline recruteur : `Recue`, `Preselection`, `Entretien`, `Decision`. Distincte du statut, qui porte la décision finale."
          "x-cjs-tier": "public"
        score_adequation:
          type:
            - "integer"
            - "null"
          description: "Score d'adéquation candidat/offre calculé par IA, de 0 à 100. Nul tant que le calcul de fond n'a pas eu lieu."
          "x-cjs-tier": "public"
        score_calcule_le:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Date du calcul du score d'adéquation. Permet de distinguer un score absent d'un score jamais calculé."
          "x-cjs-tier": "public"
        favori_recruteur:
          type: "boolean"
          description: "Candidature marquée comme favorite par le recruteur."
          "x-cjs-tier": "public"
        notifications_consent:
          type: "boolean"
          description: "Le candidat a accepté d'être notifié du suivi de sa candidature."
          "x-cjs-tier": "public"
        consent_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Horodatage de l'acceptation des CGU. Traçabilité exigée par l'audit CDP."
          "x-cjs-tier": "public"
        cgu_version:
          type:
            - "string"
            - "null"
          description: "Version des CGU acceptée, pour savoir à quel texte le consentement se rapporte."
          "x-cjs-tier": "public"
        soumise_a:
          type: "string"
          format: "date-time"
          description: "Date de soumission de la candidature — début du délai de traitement."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
    evenementsRow:
      type: "object"
      description: "Événement du calendrier CJS — formation, atelier, forum, webinaire, conférence ou cours en centre."
      properties:
        id:
          type: "string"
          description: "Identifiant de l'événement."
          "x-cjs-tier": "pseudonyme"
        titre:
          type: "string"
          description: "Intitulé de l'événement tel qu'affiché."
          "x-cjs-tier": "public"
        type:
          type: "string"
          enum:
            - "Formation"
            - "Atelier"
            - "Forum"
            - "Webinar"
            - "Conference"
            - "Cours"
          description: "Nature de l'événement : formation, atelier, forum, webinaire, conférence, cours."
          "x-cjs-tier": "public"
        statut:
          type: "string"
          enum:
            - "a_venir"
            - "en_cours"
            - "termine"
            - "annule"
            - "en_relecture"
            - "refuse"
          description: "Cycle de vie : `a_venir`, `en_cours`, `termine`, `annule`, plus `en_relecture` et `refuse` pour la validation admin."
          "x-cjs-tier": "public"
        date_debut:
          type: "string"
          format: "date-time"
          description: "Début de l'événement."
          "x-cjs-tier": "public"
        date_fin:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "Fin de l'événement."
          "x-cjs-tier": "public"
        lieu:
          type: "string"
          description: "Lieu tel que saisi, en texte libre — non géocodé."
          "x-cjs-tier": "public"
        centre_id:
          type:
            - "string"
            - "null"
          description: "Centre organisateur, quand l'événement s'y tient."
          "x-cjs-tier": "pseudonyme"
        capacite_max:
          type:
            - "integer"
            - "null"
          description: "Nombre de places. Au-delà, les inscriptions basculent en liste d'attente."
          "x-cjs-tier": "public"
        est_gratuit:
          type: "boolean"
          description: "Participation gratuite."
          "x-cjs-tier": "public"
        created_at:
          type: "string"
          format: "date-time"
          description: "Date de création de la fiche."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
    inscriptions_evenementsRow:
      type: "object"
      description: "Inscription d'un jeune à un événement, unique par couple (jeune, événement). Le statut `present` matérialise la présence constatée, pas l'intention."
      properties:
        id:
          type: "string"
          description: "Identifiant de l'inscription."
          "x-cjs-tier": "pseudonyme"
        cjs_uid:
          type: "string"
          description: "Jeune inscrit — clé de jointure vers `utilisateurs`."
          "x-cjs-tier": "pseudonyme"
        evenement_id:
          type: "string"
          description: "Événement concerné — clé de jointure vers `evenements`."
          "x-cjs-tier": "pseudonyme"
        statut:
          type: "string"
          enum:
            - "inscrit"
