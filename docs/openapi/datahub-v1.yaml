        latitude:
          type: "number"
          description: "Latitude du centre, pour la carte et les calculs de proximité."
          "x-cjs-tier": "public"
        longitude:
          type: "number"
          description: "Longitude du centre."
          "x-cjs-tier": "public"
        est_actif:
          type: "boolean"
