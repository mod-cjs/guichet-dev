          "x-cjs-tier": "public"
        inscrit_a:
          type: "string"
          format: "date-time"
          description: "Date de l'inscription."
          "x-cjs-tier": "public"
        updated_at:
          type: "string"
          format: "date-time"
          description: "Dernière modification. Watermark de réplication Data Hub."
          "x-cjs-tier": "public"
    centresRow:
