<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 3 — Opportunités · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="cjs-card.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="lot3-opps-web.jsx"></script>
<script type="text/babel" src="lot3-opps-mobile.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 1060;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 3 — Opportunités"
    subtitle="Liste · filtres avancés · détail · candidature · confirmation (web + mobile)"
  >
    <DCSection
      id="web"
      title="A · Web — Liste, détail, candidature"
      subtitle="Sidebar 260 + filtres latéraux + slide-over + modal"
    >
      <DCArtboard id="w1" label="Liste · filtres + 5 résultats" width={WEB_W} height={WEB_H}>
        <WebOppList />
      </DCArtboard>
      <DCArtboard id="w2" label="Liste + slide-over détail" width={WEB_W} height={WEB_H}>
        <WebOppList withDetail />
      </DCArtboard>
      <DCArtboard id="w3" label="Modal Postuler · pré-rempli SSO" width={WEB_W} height={WEB_H}>
        <WebOppList withDetail withApplyModal />
      </DCArtboard>
      <DCArtboard id="w4" label="État vide · aucun résultat" width={WEB_W} height={WEB_H}>
        <WebOppList empty />
      </DCArtboard>
    </DCSection>

    <DCSection
      id="mobile"
      title="B · Mobile — Liste, détail, candidature, confirmation"
      subtitle="Bottom-sheet filtres · sheet ascendante détail · sheet Postuler · WhatsApp"
    >
      <DCArtboard id="m1" label="Liste · chips + recherche" width={PHONE_W} height={PHONE_H}>
        <MobileOppList />
      </DCArtboard>
      <DCArtboard id="m2" label="Bottom-sheet filtres" width={PHONE_W} height={PHONE_H}>
        <MobileOppListWithFilters />
      </DCArtboard>
      <DCArtboard id="m3" label="Détail · sheet ascendante" width={PHONE_W} height={PHONE_H}>
        <MobileOppDetailSheet />
      </DCArtboard>
      <DCArtboard id="m4" label="Sheet Postuler · pré-rempli" width={PHONE_W} height={PHONE_H}>
        <MobileApplySheet />
      </DCArtboard>
      <DCArtboard id="m5" label="Confirmation envoyée · WhatsApp" width={PHONE_W} height={PHONE_H}>
        <MobileApplyConfirmation />
      </DCArtboard>
      <DCArtboard id="m6" label="État vide" width={PHONE_W} height={PHONE_H}>
        <MobileOppList empty />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="lot-nav.js"></script>
<script src="toast.js"></script>
<script src="accessibility.js"></script>
<script src="yaye-fab.js"></script>
</body>
</html>
