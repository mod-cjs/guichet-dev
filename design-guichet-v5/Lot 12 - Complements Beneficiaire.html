<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lot 12 — Compléments bénéficiaire & Auth · Guichet Jeunesse</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="assets/icons.css">
<script src="assets/icons.js" defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:var(--gj-font-sans)}
  .gj-icon{display:inline-block;flex-shrink:0;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="phone.jsx"></script>
<script type="text/babel" src="web-dashboard.jsx"></script>
<script type="text/babel" src="benef-extra-data.jsx"></script>
<script type="text/babel" src="benef-extra-web.jsx"></script>
<script type="text/babel" src="benef-extra-mobile.jsx"></script>
<script type="text/babel" src="auth-screens.jsx"></script>

<script type="text/babel">
const WEB_W = 1280;
const WEB_H = 1180;
const PHONE_W = 390;
const PHONE_H = 844;

const App = () => (
  <DesignCanvas
    title="Lot 12 — Compléments bénéficiaire & Authentification"
    subtitle="Messagerie · sauvegardes · notifications · confidentialité · connexion (web + mobile)"
  >
    <DCSection id="auth" title="A · Authentification & consentement" subtitle="Écrans communs — connexion, récupération, RGPD">
      <DCArtboard id="a1" label="Connexion (web)" width={WEB_W} height={760}>
        <AuthLogin />
      </DCArtboard>
      <DCArtboard id="a2" label="Mot de passe oublié (web)" width={WEB_W} height={760}>
        <AuthForgot />
      </DCArtboard>
      <DCArtboard id="a3" label="Consentement données / RGPD (web)" width={WEB_W} height={820}>
        <ConsentGate />
      </DCArtboard>
      <DCArtboard id="a4" label="Connexion (mobile)" width={PHONE_W} height={PHONE_H}>
        <AuthLogin compact />
      </DCArtboard>
      <DCArtboard id="a5" label="Consentement (mobile)" width={PHONE_W} height={PHONE_H}>
        <ConsentGate compact />
      </DCArtboard>
    </DCSection>

    <DCSection id="web" title="B · Espace bénéficiaire — Web" subtitle="Sidebar bénéficiaire · messagerie, sauvegardes, notifications, confidentialité">
      <DCArtboard id="w1" label="Messagerie" width={WEB_W} height={WEB_H}>
        <WebBenefExtra view="messages" />
      </DCArtboard>
      <DCArtboard id="w2" label="Mes sauvegardes" width={WEB_W} height={WEB_H}>
        <WebBenefExtra view="saved" />
      </DCArtboard>
      <DCArtboard id="w3" label="Notifications & préférences" width={WEB_W} height={WEB_H}>
        <WebBenefExtra view="notifs" />
      </DCArtboard>
      <DCArtboard id="w4" label="Confidentialité & données" width={WEB_W} height={WEB_H}>
        <WebBenefExtra view="privacy" />
      </DCArtboard>
    </DCSection>

    <DCSection id="mobile" title="C · Espace bénéficiaire — Mobile" subtitle="Messagerie, sauvegardes, notifications">
      <DCArtboard id="m1" label="Messagerie" width={PHONE_W} height={PHONE_H}>
        <MobileBenefMessages />
      </DCArtboard>
      <DCArtboard id="m2" label="Mes sauvegardes" width={PHONE_W} height={PHONE_H}>
        <MobileBenefSaved />
      </DCArtboard>
      <DCArtboard id="m3" label="Notifications & préférences" width={PHONE_W} height={PHONE_H}>
        <MobileBenefNotifs />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="lot-nav.js"></script>
<script src="toast.js"></script>
<script src="accessibility.js"></script>
<script src="yaye-fab.js"></script>
</body>
</html>
